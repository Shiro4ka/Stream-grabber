<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{width:640px;max-height:580px;overflow:auto;margin:0;background:#1b1b1f;color:#eee;font:13px system-ui,sans-serif}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px;background:#1b1b1f;border-bottom:1px solid #2c2c34}
  .sp{flex:1}
  .sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .sw input{display:none}
  .knob{width:34px;height:20px;border-radius:10px;background:#4b4b57;position:relative;transition:.15s;flex:none}
  .knob::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked + .knob{background:#0ea5e9}
  .sw input:checked + .knob::after{left:16px}
  #off{background:#3b2f10;color:#fbbf24;padding:8px 10px;font-size:12px}
  #wrap{padding:10px}
  .row{display:flex;gap:10px;background:#26262c;border-radius:10px;padding:8px;margin-bottom:8px;align-items:center}
  .row.dup{opacity:.6}
  .chk{flex:none;width:16px;height:16px}
  .thbox{position:relative;width:112px;height:63px;flex:none;background:#000;border-radius:6px;overflow:hidden}
  .th{width:100%;height:100%;object-fit:cover}
  .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:4px;font-size:11px}
  .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  input[type=text],select{background:#34343c;color:#eee;border:1px solid #44444e;border-radius:6px;padding:5px 7px;font:inherit;min-width:0}
  .anime{width:100%}
  .line{display:flex;gap:6px}
  .epbox{display:flex;gap:2px;flex:none}
  .epbox button{padding:4px 8px;background:#3a3a44}
  .ep{width:46px;text-align:center}
  .q{flex:1}
  .sub{font-size:11px;color:#9a9aa6}
  .warn{color:#fbbf24}
  .side{display:flex;flex-direction:column;justify-content:center;gap:6px}
  .line2{display:flex;gap:6px}
  .line2 button{flex:1;padding:7px 8px}
  button{background:#0ea5e9;color:#fff;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit}
  button:disabled{opacity:.5;cursor:default}
  button.sec{background:#3a3a44}
  button.icon{padding:6px 9px;font-size:15px;line-height:1}
  button.icon small{font-size:11px;margin-left:3px;color:#cbd5e1}
  button.on{background:#0ea5e9}
  #kpanel{margin:10px 10px 0;background:#232a33;border:1px solid #33414f;border-radius:10px;padding:10px;font-size:12.5px}
  #kpanel .krow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  #kpanel input[type=number]{width:64px;background:#34343c;color:#eee;border:1px solid #44444e;border-radius:6px;padding:4px 6px;font:inherit}
  #kinfo b{color:#7dd3fc}
  #kprog{margin-top:8px;color:#cbd5e1}
  #kfails{margin-top:4px;color:#fbbf24;font-size:12px}
  #dubbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;color:#9a9aa6}
  #dubbar select{background:#34343c;color:#eee;border:1px solid #44444e;border-radius:6px;padding:4px 7px;font:inherit}
  .chip{display:inline-block;background:#33414f;color:#bae6fd;border-radius:10px;padding:0 7px;font-size:11px}
  #fmt{background:#34343c;color:#eee;border:1px solid #44444e;border-radius:6px;padding:6px 4px;font:inherit}
  #check{background:#3b2f10;border:1px solid #6b5a1e;border-radius:10px;padding:10px;margin-bottom:10px;font-size:12.5px;color:#fde68a}
  #check ul{margin:6px 0 8px;padding-left:18px}
  #check .krow{display:flex;gap:8px}
  .selbar{display:flex;gap:12px;align-items:center;font-size:12px;color:#9a9aa6;margin:0 0 6px}
  .selbar a{color:#7dd3fc;cursor:pointer}
  .grid{display:grid;gap:4px;justify-content:start;margin-bottom:10px}
  .tile{position:relative;aspect-ratio:16/9;background:#000;border-radius:5px;overflow:hidden;cursor:pointer;outline:2px solid transparent;outline-offset:-2px;font-size:clamp(8px,calc(var(--tile,48px)*.24),15px);user-select:none}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.45}
  .tile.on img{opacity:1}
  .tile.on{outline-color:#0ea5e9}
  .tile.q{filter:grayscale(1)}
  .tile.cur{outline-color:#fff}
  .tile .num{position:absolute;left:2px;top:1px;background:rgba(0,0,0,.75);color:#fff;font-weight:700;padding:0 .3em;border-radius:4px;line-height:1.3}
  .tile .ico{position:absolute;right:2px;bottom:1px;line-height:1;text-shadow:0 0 3px #000}
  .tile .ed{position:absolute;right:2px;top:1px;background:rgba(0,0,0,.6);border-radius:4px;padding:0 .25em;line-height:1.3;color:#cbd5e1}
  .tile .ed:hover{background:#0ea5e9;color:#fff}
  .hint{padding:14px 6px;color:#aaa;text-align:center}
  .foot{display:flex;gap:6px;margin-top:4px}
  #dupnote{text-align:center;color:#8a8a98;font-size:12px;margin:4px 0}
  a#all{color:#7dd3fc;cursor:pointer;font-size:12px;display:block;text-align:center;margin:4px 0}
</style></head>
<body>
  <div class="top">
    <label class="sw" data-i18n-title="detectHotkey">
      <input type="checkbox" id="en"><span class="knob"></span><span data-i18n="detect"></span>
    </label>
    <span class="sp"></span>
    <button id="found" class="sec icon">🧲<small id="foundn"></small></button>
    <button id="queue" class="sec icon" data-i18n-title="openQueue">⬇️</button>
    <button id="clear" class="sec icon" data-i18n-title="clearList">🗑️</button>
    <button id="gear" class="sec icon" data-i18n-title="settings">⚙️</button>
    <select id="fmt" data-i18n-title="fmtTitle"><option value="mp4">MP4</option><option value="ts">TS</option></select>
    <button id="dlall" data-i18n="downloadAll"></button>
  </div>
  <div id="off" data-i18n="detectOff" hidden></div>
  <div id="kpanel" hidden>
    <div id="kinfo"></div>
    <div class="krow">
      <span data-i18n="kFrom"></span> <input type="number" id="kfrom" min="0">
      <span data-i18n="kTo"></span> <input type="number" id="kto" min="0">
      <label><input type="checkbox" id="kauto" checked> <span data-i18n="kAuto"></span></label>
    </div>
    <div class="krow">
      <button id="kscan" data-i18n="kScan"></button>
      <button id="kstop" class="sec" data-i18n="kStop" hidden></button>
      <button id="kdiag" class="sec" data-i18n="kDiag"></button>
    </div>
    <div id="kprog"></div><div id="kfails"></div>
  </div>
  <div id="wrap">
    <div id="check" hidden></div>
    <div id="dubbar" hidden><span data-i18n="dub"></span> <select id="dubsel"></select></div>
    <div id="list"></div>
    <div id="dupnote" hidden></div>
  </div>
  <script src="lib.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body></html>
